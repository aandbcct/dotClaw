# ============================================
# dotClaw 模型路由配置模板
# 复制为 model_router_config.yaml 后按本地环境修改；该本地文件不提交。
# ============================================

defaults:
  parameters:
    temperature: 0.7
    max_tokens: 4096
  fallback_enabled: true

providers:
  qwen:
    driver: openai_chat_completions
    api_key: ${QWEN_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    rate_limit:
      requests_per_minute: 0
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 30
      half_open_max: 1
    retry:
      max_attempts: 3
      backoff_factor: 2.0
  deepseek:
    driver: openai_chat_completions
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    rate_limit:
      requests_per_minute: 0
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 30
      half_open_max: 1
    retry:
      max_attempts: 2
  openai:
    driver: openai_chat_completions
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    rate_limit:
      requests_per_minute: 0
    circuit_breaker:
      failure_threshold: 5
      cooldown_seconds: 30
      half_open_max: 1

models:
  qwen3.7-max:
    provider: qwen
    model_id: qwen3.7-max-preview
    context_window: 991000
    tokenizer_encoding: cl100k_base
    capabilities: [chat, function_calling]
    status: active
    reasoning:
      mode: native
  qwen3.7-plus:
    provider: qwen
    model_id: qwen3.7-plus-2026-05-26
    context_window: 991000
    tokenizer_encoding: cl100k_base
    capabilities: [chat, function_calling]
    status: active
    reasoning:
      mode: native
  text-embedding-v4:
    provider: qwen
    model_id: text-embedding-v4
    context_window: 33000
    capabilities: [embedding]
    status: active
  deepseek-v4-flash:
    provider: deepseek
    model_id: deepseek-v4-flash
    context_window: 64000
    capabilities: [chat, function_calling]
    status: active
  gpt-4o-mini:
    provider: openai
    model_id: gpt-4o-mini
    context_window: 128000
    capabilities: [chat, function_calling]
    status: active
purposes:
  chat:
    description: "日常对话"
    priority:
      - model: qwen3.7-plus
        priority: 1
      - model: deepseek-v4-flash
        priority: 2
      - model: gemini-3.5-flash
        priority: 3
      - model: gpt-4o-mini
        priority: 4
  embedding:
    description: "向量化"
    priority:
      - model: text-embedding-v4
        priority: 1
  context_compaction:
    description: "上下文历史压缩"
    priority:
      - model: qwen3.7-max
        priority: 1
