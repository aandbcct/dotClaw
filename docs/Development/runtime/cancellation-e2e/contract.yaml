scope:
  include: [真实浏览器, 各版真实前端和Web与Runtime, 受控本地能力, 分段测量, 失败与超时保留, 报告及复现脚本]
  exclude: [生产功能修改, 真实付费供应商, 用户文件, 现有容器重启, 压测全系统, 自动push或PR]
decisions:
  - 两版源码及前端均按提交隔离，实际导入路径和commit必须写入样本环境。
  - 不得用浏览器路由mock或假时钟替代主测试HTTP及DOM路径。
  - 开发先做每场景各版1次debug，确认有效后冻结配置再正式执行。
  - 每场景每版2次预热与20次正式，分两轮旧新顺序交错，各10正式。
  - 点击前能力必须已到同一明确阶段屏障；从真实click起10秒截止，未结束为右删失timeout。
  - 成功要求页面权威cancelled、资源退出、终态完整提交、刷新一致、后续请求可运行且无误伤。
  - 后处理隔离清理只能发生在样本判定后，不得算作被测系统取消成功。
  - 不同钟不直接相减；browser总耗时和backend分段各用本钟，映射需报告误差，无映射字段为null。
scenarios: [before_first, streaming, command, delegation] # 分别为首包前、流式中、命令树、父子委派
data_models:
  sample:
    required: [protocol_version, version, scenario, phase, round, attempt, status, deadline_ms, browser_clock, backend_clock, cancel_success, overall_success, refresh_error, followup_success, unrelated_task_stopped]
    status: [success, failure, timeout, entry_unavailable, invalid_fixture]
    timestamps: [browser_click_ms, backend_receive_s, backend_resource_exit_s, backend_terminal_commits_s, browser_dom_terminal_ms]
    latencies_ms: [browser_click_to_terminal_ms, backend_receive_to_resource_exit_ms, backend_receive_to_terminal_commit_ms, terminal_to_page_ms]
    ownership: [target_session_id, target_run_id, cancel_http_target, target_commit_confirmed, persisted_target_outcome, resource_pids]
    mapping: 原嵌套设计以扁平字段序列化，version对应source_commit，phase区分debug/warmup/formal，invalid_fixture由status表示，refresh_error为刷新不一致，schema_version在整批config中。
  summary:
    files: [config.json, environment.json, summary.json, qualification.json, boundary-audit.json, verification.json, report.md, formal.jsonl, warmup.jsonl, debug.jsonl]
    mapping: 环境与源码事实在environment中，各版本场景统计在summary中，数量及无效输入在qualification中，原始样本与限制由report引用。
acceptance:
  - 主流程必须真实浏览器与真实HTTP，旧版和新版真实前端均加载。
  - valid样本成功率分母含超时与失败；预热debug无效输入保留但单列；延迟仅有观测值者统计且列n。
  - P50/P95/max与超过5秒比例可重算，超时不能伪造为10秒成功。
  - 不宣称真实供应商远端停止、线上成功率或未测场景普遍性能保证。
  - 可复现脚本和脱敏小型原始数据可随代码审阅，不只写入ignored reports。
